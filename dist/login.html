<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oxford IA - Iniciar Sesión</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.bg-orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; }
.bg-orb-1 { width:400px; height:400px; background:rgba(249,115,22,0.15); top:-100px; right:-100px; }
.bg-orb-2 { width:300px; height:300px; background:rgba(168,85,247,0.15); bottom:-80px; left:-80px; }
.card {
  position:relative; z-index:10; width:100%; max-width:400px;
  background:rgba(255,255,255,0.05); backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1); border-radius:24px;
  padding:40px 32px; box-shadow:0 25px 60px rgba(0,0,0,0.4);
}
.logo {
  width:72px; height:72px; margin:0 auto 24px;
  background:linear-gradient(135deg,#f97316,#ea580c); border-radius:18px;
  display:flex; align-items:center; justify-content:center;
  font-size:36px; font-weight:bold; box-shadow:0 10px 30px rgba(249,115,22,0.3);
}
h1 { text-align:center; font-size:22px; margin-bottom:4px; }
.subtitle { text-align:center; font-size:13px; color:rgba(216,180,254,0.8); margin-bottom:32px; }
label { display:block; font-size:13px; font-weight:500; color:rgba(216,180,254,0.9); margin-bottom:6px; }
input {
  width:100%; padding:12px 16px; background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1); border-radius:14px;
  color:#fff; font-size:15px; outline:none; transition:all .2s;
  margin-bottom:16px;
}
input:focus { border-color:rgba(249,115,22,0.5); background:rgba(255,255,255,0.1); }
input::placeholder { color:rgba(216,180,254,0.4); }
button {
  width:100%; padding:14px; background:linear-gradient(135deg,#f97316,#ea580c);
  border:none; border-radius:14px; color:#fff; font-size:16px; font-weight:600;
  cursor:pointer; transition:all .2s; box-shadow:0 8px 25px rgba(249,115,22,0.3);
  margin-top:8px;
}
button:hover { transform:translateY(-1px); box-shadow:0 12px 35px rgba(249,115,22,0.4); }
button:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
.error {
  background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3);
  border-radius:12px; padding:12px; margin-bottom:20px;
  font-size:13px; color:rgba(252,165,165,0.9); display:none;
}
.error.show { display:block; }
.spinner { display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; margin-right:8px; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }
.footer { text-align:center; margin-top:24px; font-size:11px; color:rgba(216,180,254,0.4); }
.pw-toggle { position:absolute; right:14px; top:38px; background:none; border:none; color:rgba(216,180,254,0.5); cursor:pointer; font-size:20px; width:auto; padding:4px; box-shadow:none; }
.pw-toggle:hover { color:#fff; transform:none; box-shadow:none; }
.pw-wrapper { position:relative; }
</style>
</head>
<body>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<form class="card" id="loginForm">
  <div class="logo">🧠</div>
  <h1>Oxford IA</h1>
  <p class="subtitle">TeacherBot · Iniciar Sesión</p>

  <div id="errorBox" class="error"></div>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="admin@teacherbot.edu.ec" required autofocus>

  <label for="password">Contraseña</label>
  <div class="pw-wrapper">
    <input type="password" id="password" placeholder="••••••••" required>
    <button type="button" class="pw-toggle" onclick="togglePassword()">👁</button>
  </div>

  <button type="submit" id="submitBtn">
    <span id="btnText">Ingresar</span>
    <span id="btnSpinner" class="spinner" style="display:none"></span>
  </button>

  <p class="footer">Unidad Educativa Oxford &copy; 2026</p>
</form>

<script>
function togglePassword() {
  const p = document.getElementById('password');
  p.type = p.type === 'password' ? 'text' : 'password';
}

function getDashboard(role) {
  const map = { admin:'/sistemas', vicerrector:'/vicerrectorado', docente:'/docente', estudiante:'/estudiante', sistemas:'/sistemas' };
  return map[role] || '/docente';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('errorBox');
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const spinner = document.getElementById('btnSpinner');

  errorBox.classList.remove('show');
  btn.disabled = true;
  btnText.style.display = 'none';
  spinner.style.display = 'inline-block';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });

    const data = await res.json();

    if (!res.ok) {
      errorBox.textContent = data.error || 'Error al iniciar sesión';
      errorBox.classList.add('show');
      return;
    }

    // Login successful → redirect
    window.location.href = getDashboard(data.user.role);
  } catch(err) {
    errorBox.textContent = 'Error de conexión. Intente de nuevo.';
    errorBox.classList.add('show');
  } finally {
    btn.disabled = false;
    btnText.style.display = 'inline';
    spinner.style.display = 'none';
  }
});
</script>
</body>
</html>
